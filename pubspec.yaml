name: touch_assistant
description: Free offline Assistive Touch for Android - floating button with system actions. No ads, no tracking, no server.
publish_to: 'none'
version: 1.0.1+2

environment:
  sdk: '>=3.2.0 <4.0.0'

dependencies:
  flutter:
    sdk: flutter
  flutter_overlay_window: ^0.4.5
  flutter_accessibility_service: ^1.0.0
  shared_preferences: ^2.2.3
  volume_controller: ^2.0.7
  permission_handler: ^11.3.1
  cupertino_icons: ^1.0.8

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^4.0.0

flutter:
  uses-material-design: true
