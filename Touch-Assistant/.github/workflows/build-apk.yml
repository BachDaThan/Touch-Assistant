name: Build & Release APK

on:
  push:
    branches: [ main, master ]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 35

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Java 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: 'stable'
          cache: true

      - name: Get dependencies
        run: flutter pub get

      # ===== Ký APK (nếu có secrets) =====
      - name: Decode keystore
        if: ${{ secrets.KEYSTORE_BASE64 != '' }}
        run: |
          echo "${{ secrets.KEYSTORE_BASE64 }}" | base64 --decode > android/app/upload-keystore.jks
          cat > android/key.properties << PROP
          storePassword=${{ secrets.KEYSTORE_PASSWORD }}
          keyPassword=${{ secrets.KEY_PASSWORD }}
          keyAlias=${{ secrets.KEY_ALIAS }}
          storeFile=upload-keystore.jks
          PROP

      - name: Build release APK (signed if keystore present)
        run: flutter build apk --release

      - name: Prepare APK
        id: prepare
        run: |
          VERSION=$(grep '^version:' pubspec.yaml | sed 's/version: //' | tr -d ' ' | cut -d'+' -f1)
          BUILD_NUM=${{ github.run_number }}
          mkdir -p release
          cp build/app/outputs/flutter-apk/app-release.apk "release/Touch-Assistant-v${VERSION}.apk"
          echo "version=${VERSION}" >> $GITHUB_OUTPUT
          echo "tag=v${VERSION}-${BUILD_NUM}" >> $GITHUB_OUTPUT
          ls -lh release/

      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: Touch-Assistant-APK
          path: release/*.apk
          retention-days: 30

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ steps.prepare.outputs.tag }}
          name: Touch Assistant v${{ steps.prepare.outputs.version }} (build ${{ github.run_number }})
          body: |
            ## Touch Assistant v${{ steps.prepare.outputs.version }}

            **Tải file APK bên dưới → cài và dùng ngay.**

            APK đã được ký → có thể **cài đè** bản cũ.

            ### Tính năng
            - Nút nổi kéo thả
            - Home / Back / Recents / Khóa màn hình / Chụp màn hình
            - Tăng / Giảm âm lượng
            - Hoàn toàn offline, không ads, không gửi dữ liệu

            ### Cách dùng
            1. Tải file `.apk` ở phần **Assets**
            2. Cài trên điện thoại
            3. Bật Accessibility + Overlay
            4. Bật nút nổi

            ---
            Build: `${{ github.sha }}`
          files: release/*.apk
          draft: false
          prerelease: false
          generate_release_notes: true
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
