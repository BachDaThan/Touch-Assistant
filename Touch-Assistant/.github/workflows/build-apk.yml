name: Build & Release APK

on:
  push:
    branches: [ main, master ]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 35

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Java 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: 'stable'
          cache: true

      - name: Get dependencies
        run: flutter pub get

      - name: Build release APK
        run: flutter build apk --release

      - name: Prepare APK
        id: prepare
        run: |
          VERSION=$(grep '^version:' pubspec.yaml | sed 's/version: //' | tr -d ' ' | cut -d'+' -f1)
          BUILD_NUM=${{ github.run_number }}
          mkdir -p release
          cp build/app/outputs/flutter-apk/app-release.apk "release/Touch-Assistant-v${VERSION}.apk"
          echo "version=${VERSION}" >> $GITHUB_OUTPUT
          echo "tag=v${VERSION}-${BUILD_NUM}" >> $GITHUB_OUTPUT
          ls -lh release/

      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: Touch-Assistant-APK
          path: release/*.apk
          retention-days: 30

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ steps.prepare.outputs.tag }}
          name: Touch Assistant v${{ steps.prepare.outputs.version }} (build ${{ github.run_number }})
          body: |
            ## Touch Assistant v${{ steps.prepare.outputs.version }}

            **Tải file APK bên dưới → cài và dùng ngay.**

            ### Tính năng
            - Nút nổi kéo thả
            - Home / Back / Recents / Khóa màn hình / Chụp màn hình
            - Tăng / Giảm âm lượng
            - Hoàn toàn offline, không ads, không gửi dữ liệu

            ### Cách dùng nhanh
            1. Tải file `.apk` ở phần **Assets** bên dưới
            2. Cài trên điện thoại (cho phép cài từ nguồn không xác định nếu cần)
            3. Mở app → bật **Accessibility** + quyền **Hiển thị trên ứng dụng khác**
            4. Bật công tắc nút nổi

            ---
            Build tự động từ commit: `${{ github.sha }}`
          files: release/*.apk
          draft: false
          prerelease: false
          generate_release_notes: true
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
