name: Build & Release APK

on:
  push:
    branches: [ main, master ]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 45

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Java 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: 'stable'
          flutter-version: '3.24.5'
          cache: true

      - name: Backup custom Android files
        run: |
          mkdir -p /tmp/android_custom
          cp android/app/src/main/AndroidManifest.xml /tmp/android_custom/ || true
          cp android/app/src/main/res/xml/accessibilityservice.xml /tmp/android_custom/ || true
          cp android/app/src/main/res/values/strings.xml /tmp/android_custom/ || true
          cp android/app/build.gradle /tmp/android_custom/app_build.gradle || true
          cp android/settings.gradle /tmp/android_custom/settings.gradle || true
          cp android/gradle.properties /tmp/android_custom/gradle.properties || true
          cp -r android/gradle /tmp/android_custom/gradle 2>/dev/null || true

      - name: Fill missing Android boilerplate
        run: flutter create . --platforms=android --project-name touch_assistant --org com.bachdathan

      - name: Restore custom Android files
        run: |
          mkdir -p android/app/src/main/res/xml android/app/src/main/res/values
          cp /tmp/android_custom/AndroidManifest.xml android/app/src/main/AndroidManifest.xml
          cp /tmp/android_custom/accessibilityservice.xml android/app/src/main/res/xml/accessibilityservice.xml
          cp /tmp/android_custom/strings.xml android/app/src/main/res/values/strings.xml
          cp /tmp/android_custom/app_build.gradle android/app/build.gradle
          cp /tmp/android_custom/settings.gradle android/settings.gradle
          cp /tmp/android_custom/gradle.properties android/gradle.properties
          cp -r /tmp/android_custom/gradle android/ 2>/dev/null || true

      - name: Get dependencies
        run: flutter pub get

      - name: Setup signing (optional)
        env:
          KEYSTORE_BASE64: ${{ secrets.KEYSTORE_BASE64 }}
          KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
        run: |
          # Quan trọng: không để lệnh fail làm dừng step (Actions dùng bash -e)
          set +e

          rm -f android/key.properties android/app/upload-keystore.jks

          if [ -z "$KEYSTORE_BASE64" ]; then
            echo ">>> No KEYSTORE_BASE64 → debug signing"
            exit 0
          fi

          echo ">>> KEYSTORE_BASE64 length: ${#KEYSTORE_BASE64}"
          echo "$KEYSTORE_BASE64" | tr -d ' \n\r\t' | base64 --decode > android/app/upload-keystore.jks
          if [ ! -s android/app/upload-keystore.jks ]; then
            echo ">>> Decode failed → debug signing"
            rm -f android/app/upload-keystore.jks
            exit 0
          fi
          echo ">>> jks size: $(wc -c < android/app/upload-keystore.jks) bytes"

          keytool -list -keystore android/app/upload-keystore.jks \
            -storepass "$KEYSTORE_PASSWORD" -storetype PKCS12 \
            > /tmp/kt_out.txt 2>&1
          echo ">>> keytool exit: $?"
          cat /tmp/kt_out.txt

          if ! grep -qi "Your keystore contains" /tmp/kt_out.txt; then
            echo ">>> Password sai hoặc keystore hỏng → debug signing (APK vẫn build)"
            rm -f android/app/upload-keystore.jks
            exit 0
          fi

          keytool -list -keystore android/app/upload-keystore.jks \
            -storepass "$KEYSTORE_PASSWORD" -alias "$KEY_ALIAS" -storetype PKCS12 \
            > /tmp/kt_alias.txt 2>&1
          cat /tmp/kt_alias.txt

          if grep -qi "keytool error\|does not exist\|password was incorrect" /tmp/kt_alias.txt; then
            echo ">>> Alias sai → debug signing"
            rm -f android/app/upload-keystore.jks
            exit 0
          fi

          {
            echo "storePassword=${KEYSTORE_PASSWORD}"
            echo "keyPassword=${KEYSTORE_PASSWORD}"
            echo "keyAlias=${KEY_ALIAS}"
            echo "storeFile=upload-keystore.jks"
          } > android/key.properties

          echo ">>> RELEASE SIGNING ON"
          exit 0

      - name: Build release APK
        run: flutter build apk --release

      - name: Prepare APK
        id: prepare
        run: |
          VERSION=$(grep '^version:' pubspec.yaml | sed 's/version: //' | tr -d ' ' | cut -d'+' -f1)
          BUILD_NUM=${{ github.run_number }}
          mkdir -p release
          cp build/app/outputs/flutter-apk/app-release.apk "release/Touch-Assistant-v${VERSION}.apk"
          echo "version=${VERSION}" >> $GITHUB_OUTPUT
          echo "tag=v${VERSION}-${BUILD_NUM}" >> $GITHUB_OUTPUT
          ls -lh release/

      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: Touch-Assistant-APK
          path: release/*.apk
          retention-days: 30

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ steps.prepare.outputs.tag }}
          name: Touch Assistant v${{ steps.prepare.outputs.version }} (build ${{ github.run_number }})
          body: |
            ## Touch Assistant v${{ steps.prepare.outputs.version }}

            **Tải APK ở Assets bên dưới.**

            ### Cách dùng
            1. Cài APK
            2. Bật Accessibility + Overlay
            3. Bật nút nổi

            Build: `${{ github.sha }}`
          files: release/*.apk
          draft: false
          prerelease: false
          generate_release_notes: true
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
